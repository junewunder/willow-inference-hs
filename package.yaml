name:                willow-hs
version:             0.1.0.0
github:              junewunder/willow-hs
license:             MIT
author:              june wunder
maintainer:          june wunder
copyright:           2025 june wunder

extra-source-files:
- README.md

synopsis:            A type-and-effect checker for React-style timing bugs
category:            Language

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/junewunder/willow-hs#readme>

dependencies:
- base >= 4.11 && < 10
- rio >= 0.1.24.0
- megaparsec >= 9.7.0
- parser-combinators >= 1.3.1
- prettyprinter >= 1.7.2
- directory
- filepath
- recursion-schemes >= 5.2.2
- template-haskell >= 2.15.0.0
- free >= 5.2
- ordered-containers
- transformers
- text
- bytestring
- process

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Wunused-imports
- -Wno-unused-imports

default-extensions:
  MultiParamTypeClasses,
  FlexibleInstances,
  GeneralizedNewtypeDeriving,
  NoImplicitPrelude,
  GADTs,
  KindSignatures,
  DataKinds,
  OverloadedStrings,
  NamedFieldPuns,
  LambdaCase,
  DeriveFunctor,
  TypeFamilies

library:
  source-dirs: src

executables:
  willow-hs-exe:
    main:                Main.hs
    source-dirs:         app
    dependencies:
    - willow-hs
    - optparse-simple

    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

tests:
  willow-hs-test:
    main:                Spec.hs
    source-dirs:         test
    dependencies:
    - willow-hs
    - hspec
    - QuickCheck
    - prettyprinter >= 1.7.1

    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N

    default-extensions:
      MultiParamTypeClasses,
      FlexibleInstances,
      GeneralizedNewtypeDeriving,
      NoImplicitPrelude,
      GADTs,
      KindSignatures,
      DataKinds,
      OverloadedStrings,
      NamedFieldPuns,
      LambdaCase,
      DeriveFunctor,
      TypeFamilies
